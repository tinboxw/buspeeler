[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "buspeeler"
version = "0.1.0"
description = "Local, passive CAN analysis workbench"
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn", "numpy", "scipy", "cantools", "pyserial", "python-multipart"]

[project.scripts]
buspeeler = "buspeeler.launcher:main"

[tool.setuptools.packages.find]
include = ["buspeeler*"]
